<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Orbit OS">
  <title>Orbit OS</title>
  <defs>
    <linearGradient id="orbitCoreGrad" x1="24" y1="24" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#5eead4" />
    </linearGradient>
    <linearGradient id="orbitRingGrad" x1="7" y1="32" x2="57" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <g transform="rotate(-22 32 32)">
    <ellipse
      cx="32" cy="32" rx="25" ry="13"
      fill="none"
      stroke="url(#orbitRingGrad)"
      stroke-width="5"
      stroke-linecap="round"
      pathLength="100"
      stroke-dasharray="78 22"
    />
    <circle cx="57" cy="32" r="3.6" fill="#5eead4" />
  </g>

  <circle cx="32" cy="32" r="8" fill="url(#orbitCoreGrad)" />
</svg>
