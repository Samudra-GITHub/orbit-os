<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Orbit OS">
  <title>Orbit OS</title>
  <!-- Flat single-color variant (no gradient) — for contexts too small or
       too constrained for the full gradient mark: app badges, monochrome
       UI chips, print stamping. -->
  <g transform="rotate(-22 32 32)">
    <ellipse
      cx="32" cy="32" rx="25" ry="13.5"
      fill="none"
      stroke="#8b5cf6"
      stroke-width="6.5"
      stroke-linecap="round"
      pathLength="100"
      stroke-dasharray="76 24"
    />
    <circle cx="57" cy="32" r="4.4" fill="#8b5cf6" />
  </g>
  <circle cx="32" cy="32" r="9.5" fill="#8b5cf6" />
</svg>
